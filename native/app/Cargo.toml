[package]
name = "proxydock"
description = "ProxyDock: tray + core process and the Slint window"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "proxydock"

[[bin]]
name = "proxydock"
path = "src/main.rs"

[[bin]]
name = "proxydock-ui"
path = "src/bin/proxydock-ui.rs"

[dependencies]
proxydock-core = { path = "../core" }
serde_json = { version = "1", features = ["preserve_order"] }
# the window only (proxydock.exe does not use it, so it is not linked there)
slint = { version = "1.19", default-features = false, features = [
    "std", "compat-1-18", "backend-winit", "renderer-software", "renderer-skia", "accessibility", "raw-window-handle-06",
] }
raw-window-handle = "0.6"
slint-node-editor = "2.0.0"
# the tray only
tray-icon = "0.26"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

[target.'cfg(windows)'.dependencies]
# the tray menu's text (menu.rs: Windows draws its own menu)
ab_glyph = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi",
    "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm", "Win32_Foundation",
    "Win32_System_Threading", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell",
    "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_System_Console", "Win32_UI_ColorSystem",
] }

# Linux / macOS: the tray's event loop (GTK / Cocoa underneath)
[target.'cfg(not(windows))'.dependencies]
tao = "0.34"

[build-dependencies]
slint-build = { version = "1.19", features = ["experimental-module-builds"] }

[target.'cfg(windows)'.build-dependencies]
# the exe files' icon (app.rc)
embed-resource = "3"

[dev-dependencies]
base64 = "0.22"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
