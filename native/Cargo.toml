# ProxyDock in Rust (replacing the Python/PySide6 app step by step; the Python app stays until this one has
# every feature). Crates:
#   core  - settings, block graph, sing-box config, engine processes (no GUI)
[workspace]
members = ["core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
