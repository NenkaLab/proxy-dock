# ProxyDock in Rust (replacing the Python/PySide6 app step by step; the Python app stays until this one has
# every feature). Crates:
#   core  - settings, block graph, sing-box config, engine processes (no GUI)
#   app   - proxydock.exe (tray + core process, no GUI toolkit) and proxydock-ui.exe (the Slint window)
[workspace]
members = ["core", "app"]
resolver = "3"

[workspace.package]
version = "3.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

# debug builds: our code lightly optimised, the dependencies (Slint, Skia, ...) fully: a usable debug window
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# slint-node-editor 2.0.0 (MIT OR Apache-2.0, KDAB) with one change: a plain mouse wheel zooms the canvas
# (upstream zooms with Ctrl + wheel and pans with the wheel). See vendor/slint-node-editor/node-editor.slint.
[patch.crates-io]
slint-node-editor = { path = "vendor/slint-node-editor" }
# its material menus restyled to the app's M3 colours (widgets/material/menu.slint, styling.slint is-dark), and
# menus taller than the window scroll (widgets/common/menus.slint, Palette.window-height)
i-slint-compiler = { path = "vendor/i-slint-compiler" }
