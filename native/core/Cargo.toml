[package]
name = "proxydock-core"
description = "ProxyDock core: settings, block graph, sing-box config, engine processes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# preserve_order: config.json keeps its key order, like the Python app writes it
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
regex-lite = "0.1"
ureq = "3.5.2"
rcgen = "0.14.10"
time = "0.3.55"
sha2 = "0.10"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading",
    "Win32_System_SystemInformation", "Win32_UI_Shell",
] }

[target."cfg(not(windows))".dependencies]
flate2 = "1.1.11"
tar = "0.4.46"

