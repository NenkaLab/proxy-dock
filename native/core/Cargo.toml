[package]
name = "proxydock-core"
description = "ProxyDock core: settings, block graph, sing-box config, engine processes"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# preserve_order: config.json keeps its key order, like the Python app writes it
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
regex-lite = "0.1"
ureq = "3.5.2"
rcgen = "0.14.10"
time = "0.3.55"
sha2 = "0.10"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
serde = "1.0.229"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
yaml-rust2 = "0.13.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
x509-parser = "0.18"
quinn-proto = { version = "0.11", default-features = false, features = ["ring", "rustls"] }
bytes = "1"
socket2 = "0.6"
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading",
    "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_System_Registry", "Win32_Networking_WinInet", "Win32_System_Time", "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_Diagnostics_ToolHelp",
] }

[target."cfg(not(windows))".dependencies]
flate2 = "1.1.11"
tar = "0.4.46"

