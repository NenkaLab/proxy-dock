[package]
name = "slint-proto"
version = "0.1.0"
edition = "2024"
publish = false

# Prototype for comparing a Slint UI with the current PySide6 one: canvas (slint-node-editor), live log,
# Korean text input, tray. Not part of the ProxyDock build.

[dependencies]
slint = { version = "1.19", default-features = false, features = [
    "std", "compat-1-18", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "system-tray", "raw-window-handle-06",
] }
slint-node-editor = "2.0.0"
tray-icon = "0.26"
raw-window-handle = "0.6"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi",
    "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm",
    "Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_SystemInformation",
] }

[build-dependencies]
slint-build = { version = "1.19", features = ["experimental-module-builds"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
