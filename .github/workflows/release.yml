name: Release

# Pushing a tag v<version> builds the Rust app (native/) on Windows, Linux and macOS and publishes a GitHub Release
# with the Windows installer and zip, the Linux AppImage and tar.gz, the macOS .dmg and zip, and SHA-256 checksums
# (tools/build_rust.py; the same file names as the Python app's). The version is native/Cargo.toml's
# ([workspace.package]); the tag must match it. "Run workflow" builds without releasing.
# The Direct line VM images (tools/build_bypass_image.py, Docker: x64 for Windows Hyper-V, arm64 for macOS) go into
# the same release: the app downloads its own the first time a VM is prepared. (Linux needs none.)
# (The Python app up to 2.6.0 is on the `old` branch, with its own release workflow.)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # (Linux and macOS are not tried on real machines yet: the release goes out without them if they fail)
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, experimental: false }
          - { name: linux, os: ubuntu-22.04, experimental: true }      # older glibc (2.35): more distributions
          - { name: macos, os: macos-latest, experimental: true }      # Apple Silicon
    env:
      GITHUB_TOKEN: ${{ github.token }}     # engine downloads (tools/fetch_singbox.py) use the API
      PYTHONIOENCODING: utf-8
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Linux: the window (fontconfig, xkbcommon) and the tray icon (GTK, AppIndicator, xdo); file for appimagetool
      - name: System packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config file libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      # (rustup installs the toolchain native/rust-toolchain.toml names)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          cache-on-failure: true

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(python tools/build_rust.py --current)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match native/Cargo.toml version ${version}"
            exit 1
          fi

      # the engines: downloaded again only when their versions change (tools/fetch_singbox.py skips what is there)
      - uses: actions/cache@v4
        with:
          path: bin
          key: engines-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/core/src/singbox/mod.rs') }}

      - name: Native engines (sing-box, Hysteria)
        run: python tools/fetch_singbox.py

      - name: Test
        working-directory: native
        run: cargo test --workspace --release

      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # the same Inno Setup version as tools/innosetup/*.isl
          choco install innosetup --version=6.7.3 -y --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { choco install innosetup -y --no-progress }

      - name: Build, archive and installer (.exe / .AppImage / .dmg)
        run: python tools/build_rust.py

      - uses: actions/upload-artifact@v4
        with:
          name: proxydock-${{ matrix.name }}
          path: dist/release-rust/*
          retention-days: 1
          if-no-files-found: error

  bypass-image:
    name: build (VPN bypass VM image)
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # (arm64 for macOS is built under emulation)
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Images (pd-agent tests first)
        run: |
          python tools/build_bypass_image.py --arch x64 --test
          python tools/build_bypass_image.py --arch arm64

      - uses: actions/upload-artifact@v4
        with:
          name: proxydock-bypass
          path: |
            dist/bypass/proxydock-bypass-*.zip
            dist/bypass/proxydock-bypass-*.zip.sha256
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [build, bypass-image]
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ls -l release
          shopt -s nullglob
          files=(release/*.zip release/*.tar.gz release/*-setup.exe release/*.dmg release/*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::nothing was built"; exit 1
          fi
          cat release/*.sha256 > release/SHA256SUMS.txt
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          files+=(release/SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # re-run after a failed job: add or replace the files on the existing release
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "ProxyDock $version" --generate-notes $prerelease
          fi
