name: Release

# Pushing a tag v<version> builds the Rust app (native/, Windows) and publishes a GitHub Release with the
# installer, the zip and SHA-256 checksums. The version is native/Cargo.toml's ([workspace.package]); the tag must
# match it. "Run workflow" builds without releasing.
# (The Python app up to 2.6.0 is on the `old` branch, with its own release workflow.)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (windows)
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}     # engine downloads (tools/fetch_singbox.py) use the API
      PYTHONIOENCODING: utf-8
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # (rustup installs the toolchain native/rust-toolchain.toml names)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(python tools/build_rust.py --current)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match native/Cargo.toml version ${version}"
            exit 1
          fi

      - name: Native engines (sing-box, Hysteria)
        run: python tools/fetch_singbox.py

      - name: Test
        working-directory: native
        run: cargo test --workspace --release

      - name: Inno Setup
        shell: pwsh
        run: |
          # the same Inno Setup version as tools/innosetup/*.isl
          choco install innosetup --version=6.7.3 -y --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { choco install innosetup -y --no-progress }

      - name: Build, zip and installer
        run: python tools/build_rust.py

      - uses: actions/upload-artifact@v4
        with:
          name: proxydock-windows
          path: dist/release-rust/*
          retention-days: 1
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ls -l release
          shopt -s nullglob
          files=(release/*.zip release/*-setup.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::nothing was built"; exit 1
          fi
          cat release/*.sha256 > release/SHA256SUMS.txt
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          files+=(release/SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # re-run after a failed job: add or replace the files on the existing release
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "ProxyDock $version" --generate-notes $prerelease
          fi
