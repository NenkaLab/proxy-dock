name: Release

# Pushing a tag v<version> (tools/release.py does it) builds Windows / Linux / macOS and publishes a
# GitHub Release with the archives and SHA-256 checksums. "Run workflow" builds without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win
            os: windows-latest
            experimental: false
          - target: linux
            os: ubuntu-22.04        # older glibc (2.35) = runs on more distributions
            experimental: false
          - target: mac
            os: macos-14            # Apple Silicon
            experimental: true      # not verified on a real Mac yet; the release goes out without it if it fails
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends binutils \
            libgl1 libegl1 libglib2.0-0 libdbus-1-3 libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-xfixes0

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(python tools/release.py --current)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ ${version}"
            exit 1
          fi

      - name: Build
        env:
          VENV_DIR: ${{ runner.temp }}/venv
        run: python tools/build.py ${{ matrix.target }}

      - name: Test
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python tests/run_tests.py

      - name: Package
        run: python tools/build.py package ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: proxydock-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ls -l release
          if ! ls release/*.zip release/*.tar.gz >/dev/null 2>&1; then
            echo "::error::no build succeeded"; exit 1
          fi
          cat release/*.sha256 > release/SHA256SUMS.txt
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.tar.gz release/SHA256SUMS.txt \
            --title "ProxyDock $version" --generate-notes $prerelease
