name: Release

# Pushing a tag v<version> (tools/release.py does it) builds Windows / Linux / macOS and publishes a
# GitHub Release with the archives, the Windows installer, the macOS .dmg, the Linux AppImage and SHA-256 checksums. "Run workflow" builds without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win
            os: windows-latest
            qpa: offscreen
            experimental: false
          - target: linux
            os: ubuntu-22.04        # older glibc (2.35) = runs on more distributions
            qpa: offscreen
            experimental: false
          - target: mac
            os: macos-latest        # Apple Silicon
            qpa: cocoa              # frameless window needs a real Cocoa window
            experimental: true      # not verified on a real Mac yet; the release goes out without it if it fails
    env:
      GITHUB_TOKEN: ${{ github.token }}     # engine downloads (tools/fetch_singbox.py) use the API
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends binutils file \
            libgl1 libegl1 libglib2.0-0 libdbus-1-3 libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-xfixes0

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="$(python tools/release.py --current)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ ${version}"
            exit 1
          fi

      - name: Build
        env:
          VENV_DIR: ${{ runner.temp }}/venv
        run: python tools/build.py ${{ matrix.target }}

      - name: Test
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt
          python tests/run_tests.py

      - name: Package
        run: python tools/build.py package ${{ matrix.target }}

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # the same Inno Setup version as tools/innosetup/*.isl
          choco install innosetup --version=6.7.3 -y --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { choco install innosetup -y --no-progress }
          python tools/build.py installer

      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        run: python tools/build.py dmg

      - name: AppImage (Linux)
        if: runner.os == 'Linux'
        env:
          VENV_DIR: ${{ runner.temp }}/venv
        run: python tools/build.py appimage

      - uses: actions/upload-artifact@v4
        with:
          name: proxydock-${{ matrix.target }}
          path: dist/release/*
          retention-days: 1
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ls -l release
          shopt -s nullglob
          files=(release/*.zip release/*.tar.gz release/*-setup.exe release/*.dmg release/*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no build succeeded"; exit 1
          fi
          cat release/*.sha256 > release/SHA256SUMS.txt
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          files+=(release/SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # re-run after a failed build job: add or replace the files on the existing release
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "ProxyDock $version" --generate-notes $prerelease
          fi
