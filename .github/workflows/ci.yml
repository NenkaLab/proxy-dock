name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  PYTHONIOENCODING: utf-8

jobs:
  rust:
    # the app (native/) on every system it builds for: format, lints, tests, a release build
    name: rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest }
          - { name: linux, os: ubuntu-latest }
          - { name: macos, os: macos-latest }
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ github.token }}     # engine downloads (tools/fetch_singbox.py) use the API
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Linux: the window (fontconfig, xkbcommon) and the tray icon (GTK, AppIndicator, xdo)
      - name: System packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      # (rustup installs the toolchain and components native/rust-toolchain.toml names)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Format
        if: runner.os == 'Windows'
        working-directory: native
        run: cargo fmt --check

      - name: Clippy
        working-directory: native
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Native engines (sing-box, Hysteria)
        run: python tools/fetch_singbox.py

      - name: Tests
        working-directory: native
        run: cargo test --workspace

      - name: Release build
        working-directory: native
        run: cargo build --release -p proxydock

      - uses: actions/upload-artifact@v4
        with:
          name: proxydock-${{ matrix.name }}
          path: |
            native/target/release/proxydock${{ runner.os == 'Windows' && '.exe' || '' }}
            native/target/release/proxydock-ui${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

  parity:
    # the Rust core against the Python app it replaced (its last state on main, native/tools/pyapp.py PY_REF)
    name: parity with the Python app
    runs-on: windows-latest
    env:
      PROXYDOCK_PY: ${{ github.workspace }}/py
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: 1e882fcbd13b8f80dd848ab661894665a8dc880f
          path: py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: py/requirements.txt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Python app's requirements
        run: python -m pip install --disable-pip-version-check -r py/requirements.txt

      - name: Parity checks
        run: python native/tools/parity_all.py 150
