name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            qpa: offscreen
            experimental: false
          - os: ubuntu-22.04
            qpa: offscreen
            experimental: false
          - os: macos-latest
            qpa: cocoa       # frameless window needs a real Cocoa window
            experimental: true      # macOS has not been verified on a real Mac yet
    env:
      GITHUB_TOKEN: ${{ github.token }}     # engine downloads (tools/fetch_singbox.py) use the API
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libdbus-1-3 libfontconfig1 libfreetype6 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-xcb1 libxcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-xfixes0

      - name: Install
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Native engines (sing-box, Hysteria)
        run: python tools/fetch_singbox.py

      - name: Compile
        run: python -m compileall -q proxydock tools tests proxydock.py

      - name: Tests
        run: python tests/run_tests.py

  rust:
    # the Rust app (native/): Windows only for now
    name: rust (windows)
    runs-on: windows-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}     # engine downloads (tools/fetch_singbox.py) use the API
      PYTHONIOENCODING: utf-8
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # (rustup installs the toolchain native/rust-toolchain.toml names)
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Native engines (sing-box, Hysteria)
        run: python tools/fetch_singbox.py

      - name: Tests
        working-directory: native
        run: cargo test --workspace
